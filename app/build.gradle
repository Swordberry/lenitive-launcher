plugins { id 'com.android.application' }
android {
    namespace 'com.local.homelauncher'
    compileSdk 34
    defaultConfig {
        applicationId "com.local.homelauncher"
        minSdk 21
        targetSdk 34
        versionCode 77
        versionName "2.2"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
dependencies {}
